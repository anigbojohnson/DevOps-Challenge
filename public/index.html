<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Todo App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <h1>My Todo App</h1>
            <p>Organise your tasks and get things done.</p>
        </div>
    </header>

    <main class="container">

        <section class="todo-form-section">
            <h2 id="form-heading">Add a new task</h2>

            <form id="todo-form">
                <div class="form-group">
                    <label for="title">Task title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="What needs to be done?"
                        maxlength="255"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        placeholder="Describe your task..."
                        rows="3"
                    ></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-button">
                        Add Task
                    </button>

                    <button type="button" id="cancel-button" class="secondary" hidden>
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <div id="message" role="status" aria-live="polite"></div>

        <section class="todo-section">
            <div class="todo-heading">
                <h2>My Tasks</h2>
                <span id="task-count">0 tasks</span>
            </div>

            <div id="todo-list">
                <p class="loading">Loading tasks...</p>
            </div>
        </section>

    </main>

    <footer>
        <p>DevOps Todo App | Node.js · Express · PostgreSQL</p>
    </footer>

    <script src="/js/app.js"></script>
</body>
</html>
